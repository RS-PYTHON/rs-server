name: Update the Trivy cache

# Download the Trivy databases once per day and save them in the GitHub cache of this repository,
# so the Trivy scans don't download them each time.
on:
  schedule: # works only on the default branch !
    - cron: "30 0 * * *" # every day at 00:30
  workflow_dispatch: # manual trigger

jobs:
  call-reusable-workflow:
    name: _
    uses: RS-PYTHON/actions/.github/workflows/reusable-update-trivy-cache.yml@develop
    permissions:
      actions: write # to delete the old caches
