name: Handle Dependabot Updates

on:
  pull_request:
    paths:
      - 'services/common/**'

permissions:
  contents: write

jobs:
  update-dependent-locks:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@v7
      - uses: RS-PYTHON/actions/.github/actions/setup-poetry@develop

      - name: Regenerate lock files
        run: |
          for dir in services/adgs services/prip services/cadip services/catalog services/frontend services/staging services/osam; do
            cd $dir
            poetry lock
            cd -
          done
          poetry lock

      - name: Commit updated lock files
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "No changes detected, skipping commit."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "chore: update dependent poetry.lock files" || echo "No changes to commit"
          git fetch origin
          git rebase origin/${GITHUB_HEAD_REF} || exit 0
          git push origin HEAD:${GITHUB_HEAD_REF}
