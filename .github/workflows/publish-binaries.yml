name: Publish wheels and Docker images

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    tags: ['**'] # new git tags (including hierarchical tags like v1.0/beta)
  workflow_dispatch: # manual trigger
    inputs:
      docker_tag:
        description: Tag the docker images as e.g. 'latest' or 'feat-rspy123'
        required: false

env:
  PYTHON_VERSION: 3.13.12
  DOCKER_REGISTRY: ghcr.io

jobs:

  # Calculate variables for this workflow
  set-env:
    name: "Set environment"
    if: github.actor != 'dependabot[bot]' # ignore pull requests by github bot
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.set-env.outputs.docker_tag }}
      branch_name: ${{ steps.set-env.outputs.branch_name }}
      debug_mode: ${{ steps.set-env.outputs.debug_mode }}
    steps:
      - id: set-env
        name: "Set environment"
        env:
          SOURCE_BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -x

          # Get the current branch name (or source branch for a pull request)
          if [[ ${{ github.event_name }} == pull_request ]]; then
            branch_name="$SOURCE_BRANCH_NAME"
          else
            branch_name=${{ github.ref_name }}
          fi

          # Determine the docker tag to set to new docker images.
          # For a pull request, use the branch name
          if [[ ${{ github.event_name }} == pull_request ]]; then
            docker_tag="$branch_name"

          # For a push on develop or a tag, use the docker tag :latest
          elif [[ ${{ github.event_name }} == push ]]; then
            docker_tag=latest

          # For a manual trigger, use the user-defined tag
          elif [[ ${{ github.event_name }} == workflow_dispatch ]]; then
            docker_tag=${{ github.event.inputs.docker_tag }}

          else
            >&2 echo "Unknown trigger"
            exit 1
          fi

          # Always use the debug mode except for new tags
          debug_mode=true
          if [[ ${{ github.ref_type }} == tag ]]; then
            debug_mode=false
          fi

          # Save values
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "docker_tag=$docker_tag" >> $GITHUB_OUTPUT
          echo "debug_mode=$debug_mode" >> $GITHUB_OUTPUT
        shell: bash

  build-wheels:
    name: "Build wheels"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    continue-on-error: false
    strategy:
      matrix:
        service: # all services must be under the services/ folder
          - adgs
          # - cadip
          # - catalog
          # - common
          # - frontend
          # - osam
          # - prip
          # - staging
    outputs:
      version_name: ${{ steps.outputs.outputs.version_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # so that Dunamai produce the correct version

      - if: ${{ matrix.service == 'frontend' }}
        uses: ./.github/actions/install-python

      - if: ${{ matrix.service == 'frontend' }}
        name: Generate the aggregated openapi.json/swagger
        run: |
          set -x
          pip install poetry # we need poetry for the sub-projects, but no need to install the root project
          ./services/frontend/resources/build_aggregated_openapi.sh --run-services --set-version
        shell: bash

      # - id: build-wheel
      #   uses: ./.github/actions/build-wheel
      #   with:
      #     package_directory: "services/${{ matrix.service }}"

      - id: build-wheel
        run: |
          set -x
          touch rs_server_${{ matrix.service }}-1.0a8.post72.dev0-py3-none-any.whl
          touch rs_server_${{ matrix.service }}-1.0a8.post72.dev0.tar.gz
          echo "version_name=my-version_name" >> "$GITHUB_OUTPUT"
      - name: Save wheel package as artifact
        uses: actions/upload-artifact@v5
        with:
          name: rs_server_${{ matrix.service }}-1.0a8.post72.dev0-py3-none-any.whl
          path: rs_server_${{ matrix.service }}-1.0a8.post72.dev0-py3-none-any.whl
      - name: Save sdist as artifact
        uses: actions/upload-artifact@v5
        with:
          name: rs_server_${{ matrix.service }}-1.0a8.post72.dev0.tar.gz
          path: rs_server_${{ matrix.service }}-1.0a8.post72.dev0.tar.gz


      - id: outputs
        # The version name should be the same for all services. Save it only once for any service.
        if: ${{ matrix.service == 'adgs' }}
        run: echo "version_name=${{ steps.build-wheel.outputs.version_name }}" >> "$GITHUB_OUTPUT"

  publish-wheels-pypi:
    name: "Publish wheels and sdists to PyPI"
    if: (github.actor != 'dependabot[bot]') && (github.event_name == 'push') && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [build-wheels]
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download dist dependencies
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ./dist
      - name: Publish wheel and sdist packages
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: true
          packages-dir: ./dist
          verbose: true

  publish-docker-images:
    name: "Build and publish Docker images"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    needs: [set-env, build-wheels]
    permissions:
     security-events: write # needed for github/codeql-action/upload-sarif
     packages: write # needed for 'docker push'
    strategy:
      matrix:
        image:
          - adgs
          # - cadip
          # - catalog
          # - frontend
          # - osam
          # - prip
          # - staging
          # - staging-dask-k8s
          # - staging-dask-local

        # Options specific to each image.
        # whl_pattern is a glob pattern to download the right binary wheels:
        # rs_server_adgs-<version>.whl, rs_server_cadip-<version>.whl, ...
        # Other options are from the publish-docker action.
        include:
          - image: adgs
            whl_pattern: "{rs_server_adgs-*.whl,rs_server_common-*.whl}"
            dockerfile: ./services/adgs/.github/Dockerfile
            image_suffix: rs-server-adgs


            build_args: "REMOVE=ME"
          # - image: cadip
          #   whl_pattern: "{rs_server_cadip-*.whl,rs_server_common-*.whl}"
          #   dockerfile: ./services/cadip/.github/Dockerfile
          #   image_suffix: rs-server-cadip
          # - image: catalog
          #   whl_pattern: "{rs_server_catalog-*.whl,rs_server_common-*.whl}"
          #   dockerfile: ./services/catalog/.github/Dockerfile
          #   image_suffix: rs-server-catalog
          # - image: frontend
          #   whl_pattern: "rs_server_frontend-*.whl"
          #   dockerfile: ./services/frontend/.github/Dockerfile
          #   image_suffix: rs-server-frontend
          # - image: osam
          #   whl_pattern: "{rs_server_osam-*.whl,rs_server_common-*.whl}"
          #   dockerfile: ./services/osam/.github/Dockerfile
          #   image_suffix: rs-server-osam
          # - image: prip
          #   whl_pattern: "{rs_server_prip-*.whl,rs_server_common-*.whl}"
          #   dockerfile: ./services/prip/.github/Dockerfile
          #   image_suffix: rs-server-prip
          # - image: staging
          #   whl_pattern: "{rs_server_staging-*.whl,rs_server_common-*.whl}"
          #   dockerfile: ./services/staging/.github/Dockerfile
          #   image_suffix: rs-server-staging
          # - image: staging-dask-k8s
          #   whl_pattern: "{rs_server_staging-*.whl,rs_server_common-*.whl}"
          #   dockerfile: ./services/staging/.github/Dockerfile.dask-staging
          #   image_suffix: dask/staging/k8s
          #   build_args: "BASE_IMAGE_TARGET=k8s"
          # - image: staging-dask-local
          #   whl_pattern: "{rs_server_staging-*.whl,rs_server_common-*.whl}"
          #   dockerfile: ./services/staging/.github/Dockerfile.dask-staging
          #   image_suffix: dask/staging/local
          #   build_args: "BASE_IMAGE_TARGET=local"

    steps:
      - uses: actions/checkout@v6

      # Download .whl files into a local dir
      - name: Download .whl dependencies
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.whl_pattern }}
          path: ./build_context_path

      # Copy the entrypoint script under the same dir
      - if: ${{ matrix.image == 'frontend' }}
        name: Copy entrypoint script
        run: cp ./services/frontend/.github/entrypoint_frontend.sh ./build_context_path

      - name: Copy Dockerfile requirements
        run: cp -t ./build_context_path ./.github/scripts/layer-cleanup.sh ./.github/scripts/restore-apt.sh

      - name: Copy debug mode dependencies
        if: ${{ needs.set-env.outputs.debug_mode == 'true' }}
        run: cp -t ./build_context_path ./.github/scripts/git_debug_image.sh

      - run: ls ./build_context_path

      - id: publish-docker
        uses: ./.github/actions/publish-docker
        with:
          dockerfile: ${{ matrix.dockerfile }}
          build_context_path: ./build_context_path
          image_basename: ${{ github.repository_owner }}/
          image_suffix: ${{ matrix.image_suffix }}
          image_tag1: ${{ needs.build-wheels.outputs.version_name }}
          image_tag2: ${{ needs.set-env.outputs.docker_tag }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_args: ${{ matrix.build_args }}
          branch_name: ${{ needs.set-env.outputs.branch_name }}
          debug_mode: ${{ needs.set-env.outputs.debug_mode }}
          dont_push: feat-rspy964-push-latest-after-tests

