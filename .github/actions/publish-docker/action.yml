name: publish-docker
description: Publish Docker image

inputs:
  dockerfile:
    description: Dockerfile path
    required: true
  build_context_path:
    description: "'docker build' context path"
    required: true
  image_basename:
    description: Docker image base name
    default: ${{ github.repository }} # = owner/repository-name
  image_suffix:
    description: Docker image name suffix e.g. _services-cadip
    required: true
  image_tags:
    description: Docker image tags, as a comma-separated list e.g. 'vx.y.z,latest'
    required: true
  dockerhub_username:
    description: vars.DOCKERHUB_USERNAME
    required: true
  dockerhub_token:
    description: secrets.DOCKERHUB_TOKEN
    required: true
  github_token:
    description: secrets.GITHUB_TOKEN
    required: true
  branch_name:
    description: Current git branch name
    required: true
  debug_mode:
    description: Add debug tools to the docker image
    required: false
  build_args:
    description: List of build-time variables
    required: false

outputs:
  docker_images:
    description: Docker images, as a comma-separated list e.g. 'name:vx.y.z,name:latest'
    value: ${{ steps.docker_images.outputs.all_docker_images }}
  last_image_tag:
    description: Last Docker image tag used in images
    value: ${{ steps.docker_images.outputs.last_image_tag }}

runs:
  using: "composite"
  steps:

    # Login to Docker Hub to increase pull quota from 100 to 200 per 6 hours
    - name: Log into Docker Hub
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Log into GitHub Container Registry
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - id: docker_images
      env:
        IMAGE_TAGS: ${{ inputs.image_tags }}
        DOCKER_IMAGE_BASE: "${{ env.DOCKER_REGISTRY }}/${{ inputs.image_basename }}${{ inputs.image_suffix }}" # without :tag
      run: |
        set -x

        # All docker images in lowercase with :tag, split by ,
        all_docker_images=

        # For each docker image tag to set, split by ,
        for image_tag in ${IMAGE_TAGS//,/ }; do

          # Only alphanumeric characters, . - and _ are allowed in docker image tags.
          # Replace other characters by -
          image_tag=$(sed "s/[^a-zA-Z0-9\.\-\_]/-/g" <<< "$image_tag")

          docker_image="${DOCKER_IMAGE_BASE,,}:${image_tag,,}" # lowercase
          all_docker_images="${all_docker_images}${docker_image},"
        done

        # Remove last ,
        all_docker_images=${all_docker_images::-1}

        echo "last_docker_image=${docker_image}" >> "$GITHUB_ENV"
        echo "last_image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
        echo "all_docker_images=${all_docker_images}" >> "$GITHUB_ENV"
        echo "all_docker_images=${all_docker_images}" >> "$GITHUB_OUTPUT"
      shell: bash

