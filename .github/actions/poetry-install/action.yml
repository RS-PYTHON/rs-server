name: poetry-install
description: "'poetry install' this project and dependencies"

inputs:
  python-version:
    description: "Python version"
    required: false
  install-project:
    description: "'poetry install' this project and dependencies ?"
    default: 'true'
  options:
    description: "'poetry install' options e.g. '--with dev'"
    required: false
    default: --with dev
  rm-plugin-dir:
    description: "Remove the installed poetry plugin directory that triggers quality issues"
    required: false
    default: 'false'
  working-directory:
    description: "The working directory from which poetry is run"
    required: false
    default: .

runs:
  using: "composite"
  steps:
    # See: https://github.com/actions/setup-python/blob/v6/docs/advanced-usage.md#caching-packages
    - name: Install poetry
      run: |
        set -x
        pipx install poetry==2.3.2
      shell: bash

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ case(inputs.python-version != '',inputs.python-version, env.PYTHON_VERSION) }}
        cache: poetry

    - if: ${{ inputs.install-project == 'true' }}
      env:
        INPUTS_PYTHON_VERSION: ${{ inputs.python-version }}
        INPUTS_OPTIONS: ${{ inputs.options }}
      run: |
        set -x

        # Regenerate the poetry.lock file for non-standard python versions
        [[ "$INPUTS_PYTHON_VERSION" != "${{ env.PYTHON_VERSION }}" ]] && poetry lock --regenerate

        poetry install $INPUTS_OPTIONS # don't use quotes around options
        poetry -q run opentelemetry-bootstrap -a install || true # install otel instrumentation packages for dependencies
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - if: ${{ inputs.rm-plugin-dir == 'true' }}
      run: |
        set -x
        rm -rf .poetry/plugins
      working-directory: ${{ inputs.working-directory }}
      shell: bash
