version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/services/adgs"
      - "/services/prip"
      - "/services/cadip"
      - "/services/catalog"
      - "/services/common"
      - "/services/frontend"
      - "/services/staging"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "dask:*"
      - dependency-name: "dask-gateway:*"
      - dependency-name: "distributed:*"
