# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/controlling-dependencies-updated#ignoring-specific-dependencies

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # A single uv.lock file for all the services of the uv workspace (see pyproject.toml).
  # Each dependency update creates a single pull request that updates pyproject.toml and uv.lock,
  # no custom script or workflow is needed.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # The dask versions must be the same as in the dask cluster images, see rs-workflow-env
      - dependency-name: "dask"
      - dependency-name: "dask-gateway"
      - dependency-name: "distributed"
