[project]
name = "rs-server-osam"
dynamic = ["version"]
description = "Copernicus Sentinel OSAM (Object Storage Access Manager)."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "ESA under contract with Airbus and CS", email = "ops_coprs@airbus.com" }]
keywords = ["copernicus", "sentinel", "processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: OpenTelemetry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.13,<4"
dependencies = [
    "rs-server-common",
    "jsonpatch>=1.33,<2",
    "openapi-core>=0.23.1",
    "ovh>=1.2.0,<2",
]

[build-system]
requires = ["hatchling>=1.33.0", "uv-dynamic-versioning>=0.14.1"]
build-backend = "hatchling.build"

# The version is calculated from the git tags, see: https://github.com/ninoseki/uv-dynamic-versioning
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
metadata = false
fallback-version = "0.0.0" # when git is not available e.g. for Dependabot

# Rebuild the package metadata (version) when the git commit or tags change
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["rs_server_osam"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
markers = [
    "unit", # mark a test as unittest
    "integration", # mark a test as integration test
]
asyncio_mode = "auto"

[tool.mypy]
warn_redundant_casts = true
# Force analyze of partially annotate function signatures
check_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120
# per-file-ignores = [
#     '__init__.py:F401',
# ]

[tool.pylint]
max-line-length = 120
disable = [
    "logging-fstring-interpolation",  # Logging f-string interpolation
    "R0917",  # Too many positional arguments
    "E0401", # import-error
    "R0902", # too-many-instance-attributes
    "R0913"  # too-many-arguments
]
ignore-paths = '^docs/.*$'

# Only add notes as comments that are not checked for errors.
notes = ["XXX"]  # No errors on TODO and FIXME

min-similarity-lines = 10  # Minimum lines number of a similarity

[tool.bandit.assert_used]
skips = ['*/*.py']

[tool.bandit]
skips = ['B603', 'B607', 'B404']
