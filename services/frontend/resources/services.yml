info:
  description: |

    The Copernicus Space Component Reference System is an open-source software solution allowing to implement,
    maintain, deploy, operate and monitor Sentinel data processing workflows based on the future re-engineered Level
    0, 1, 2 Sentinel Data processors (Q3 2024/2025).

    ---
    #### OAuth 2.0 authentication

    <a href="/auth/login" target="_self">Login</a> /
    <a href="/auth/logout" target="_blank">Logout</a>

    ---
    #### Links

    <a href="https://home.rs-python.eu/" target="_blank">Website</a> /
    <a href="https://home.rs-python.eu/rs-documentation/" target="_blank">Documentation</a> /
    <a href="${RSPY_UAC_HOMEPAGE}" target="_blank">API-Key Manager</a> /

    ---
    #### STAC Browser

    <a href="${STAC_BROWSER_URL_ADGS}" target="_blank">ADGS</a> /
    <a href="${STAC_BROWSER_URL_CADIP}" target="_blank">CADIP</a> /
    <a href="${STAC_BROWSER_URL_PRIP}" target="_blank">PRIP</a> /
    <a href="${STAC_BROWSER_URL_EDRS}" target="_blank">EDRS</a> /
    <a href="${STAC_BROWSER_URL_CATALOG}" target="_blank">Catalog</a>

    ---
services:
  adgs:
    openapi_url: http://localhost:8001/auxip/api
    change_tags:
      "": ADGS stations
      Filter Extension: ADGS (Filter Extension)
  cadip:
    openapi_url: http://localhost:8002/cadip/api
    change_tags:
      "": CADIP stations
      Filter Extension: CADIP (Filter Extension)
  prip:
    openapi_url: http://localhost:8005/prip/api
    change_tags:
      "": PRIP stations
      Filter Extension: PRIP (Filter Extension)
  edrs:
    openapi_url: http://localhost:8006/edrs/api
    change_tags:
      "": EDRS stations
      Filter Extension: EDRS (Filter Extension)
  osam:
    openapi_url: http://localhost:7001/osam/api
    change_tags:
      "": Object Storage
      Filter Extension: OSAM (Filter Extension)
  catalog:
    openapi_url: http://localhost:8003/catalog/api
    change_tags:
      "": Catalog
      Liveliness/Readiness: Catalog (Liveliness/Readiness)
      Transaction Extension: Catalog (Transaction Extension)
      Filter Extension: Catalog (Filter Extension)
      Bulk Transaction Extension: Catalog (Bulk Transaction Extension)
  staging:
    openapi_url: http://localhost:8004/openapi.json
  dpr:
    openapi_url: http://127.0.0.1:6003/openapi.json
