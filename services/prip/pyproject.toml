[project]
name = "rs-server-prip"
dynamic = ["version"]
description = "Copernicus Sentinel rs-server, PRIP service."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "ESA under contract with Airbus and CS", email = "ops_coprs@airbus.com" }]
keywords = ["stac", "copernicus", "sentinel", "processing", "prip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: OpenTelemetry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.13,<4"
dependencies = [
    "rs-server-common",
    # to enable after https://github.com/CS-SI/opentelemetry-instrumentation-eodag/issues/23 is fixed
    # "opentelemetry-instrumentation-eodag==0.4.0",
]

[project.urls]
Homepage = "https://home.rs-python.eu/"
Repository = "https://github.com/RS-PYTHON/rs-server"
Documentation = "https://home.rs-python.eu/rs-documentation/rs-server/docs/doc/users/functionalities/#prip"

[build-system]
requires = ["hatchling>=1.33.0", "uv-dynamic-versioning>=0.14.1"]
build-backend = "hatchling.build"

# The version is calculated from the git tags, see: https://github.com/ninoseki/uv-dynamic-versioning
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
metadata = false
fallback-version = "0.0.0" # when git is not available e.g. for Dependabot

# Rebuild the package metadata (version) when the git commit or tags change
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["rs_server_prip"]

# Add configuration files to the .whl package
[tool.hatch.build.targets.wheel.force-include]
"config" = "config"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
markers = [
    "unit", # mark a test as unittest
    "integration", # mark a test as integration test
]

[tool.mypy]
warn_redundant_casts = true
# Force analyze of partially annotate function signatures
check_untyped_defs = true
