prip_s1a:
  auth:
    type: TokenAuth
    auth_uri: PLACEHOLDER
    token_type: json
    token_key: access_token
    refresh_token_key: refresh_token
    token_expiration_key: expires_in
    request_method: POST
    req_data:
      client_id: PLACEHOLDER
      client_secret: PLACEHOLDER
      grant_type: PLACEHOLDER
      username: PLACEHOLDER
      password: PLACEHOLDER
    credentials:
      auth_for_token: PLACEHOLDER
    headers:
      Content-Type: application/x-www-form-urlencoded
    retrieve_headers:
      Content-Type: application/x-www-form-urlencoded
      Authorization: '{auth_for_token}'
  products:
    S1_SAR_RAW:
      productType: IW_RAW__0N
  search:
    type: ODataV4Search
    api_endpoint: http://127.0.0.1:5000/Products
    need_auth: true
    results_entry: $.value | $
    metadata_mapping:
      id:
      - null
      - $.Id
      prip:id:
      - null
      - $.Id
      Name:
      - null
      - $.Name
      ContentLength:
      - null
      - $.ContentLength
      ContentType:
      - null
      - $.ContentType
      PublicationDate:
      - null
      - $.PublicationDate
      EvictionDate:
      - null
      - $.EvictionDate
      DatetimeStart:
      - null
      - $.ContentDate.Start
      Start:
      - null
      - $.ContentDate.Start
      End:
      - null
      - $.ContentDate.End
      StartPublicationDate:
      - null
      - $.PublicationDate
      StopPublicationDate:
      - null
      - $.PublicationDate
      GeoFootprint:
      - null
      - $.GeoFootprint
      OriginDate:
      - null
      - $.OriginDate
      ProductionType:
      - null
      - $.ProductionType
      ChecksumValue:
      - null
      - '{$.Checksum[0].Value#to_lower}'
      attr_ptype:
      - null
      - $.attr_ptype
      attr_ptypes:
      - null
      - $.attr_ptype
      platformSerialIdentifier:
      - null
      - $.platformSerialIdentifier
      platformSerialIdentifiers:
      - null
      - $.platformSerialIdentifier
      platformShortName:
      - null
      - $.platformShortName
      platformShortNames:
      - null
      - $.platformShortName
      processing:datetime:
      - null
      - $.processing:datetime
      processingCenter:
      - null
      - $.processingCenter
      processorVersion:
      - null
      - $.Attributes[?(@.Name=='processorVersion')].Value
      attrs:
      - null
      - $.Attributes
      href:
      - null
      - http://127.0.0.1:5000/Products({id})/$value
      geometry: POLYGON((180 -90, 180 90, -180 90, -180 -90, 180 -90))
      downloadLink: http://127.0.0.1:5000/Products({id})/$value
      title: $.Name
      intersects_wkt:
      - null
      - $.intersects_wkt
    free_text_search_operations:
      $filter:
        union: ' OR '
        wrapper: '{}'
        operations:
          and:
          # ---- Name-based matches (from tests: contains/startswith/endswith) ----
          - "contains(Name, {Name_contains})"
          - "startswith(Name, {Name_startswith})"
          - "endswith(Name, {Name_endswith})"
          # ---- Id match (existing) ----
          - "contains(Id, {prip:id})"
          # ---- Time on PublicationDate (existing) ----
          - "(PublicationDate gt {StartPublicationDate#to_iso_utc_datetime} or PublicationDate eq {StartPublicationDate#to_iso_utc_datetime})"
          - "(PublicationDate lt {StopPublicationDate#to_iso_utc_datetime} or PublicationDate eq {StopPublicationDate#to_iso_utc_datetime})"
          - "PublicationDate eq {PublicationDate#to_iso_utc_datetime}"
          # ---- Exact equality on other top-level PRIP fields (from tests) ----
          - "EvictionDate eq {EvictionDate#to_iso_utc_datetime}"
          - "ModificationDate eq {ModificationDate#to_iso_utc_datetime}"
          - "OriginDate eq {OriginDate#to_iso_utc_datetime}"
          - "Online eq {Online}"
          - "ContentDate/Start eq {ContentStart#to_iso_utc_datetime}"
          - "ContentDate/End eq {ContentEnd#to_iso_utc_datetime}"
          # ---- Spatial Intersects (from tests) ----
          # Provide a full WKT geometry like: POLYGON((-60 0,-62 -10,-58 -10,-56 0,-60 0))
          - "OData.CSC.Intersects(area=geography'SRID=4326;{intersects_wkt}')"
          # ---- Attributes[...] == value (StringAttribute) ----
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'productType' and att/OData.CSC.StringAttribute/Value eq {attr_ptype})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'productType' and att/OData.CSC.StringAttribute/Value in ({attr_ptypes}))"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'platformShortName' and att/OData.CSC.StringAttribute/Value eq {platformShortName#to_upper})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'platformShortName' and att/OData.CSC.StringAttribute/Value in ({platformShortNames#to_upper}))"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'platformSerialIdentifier' and att/OData.CSC.StringAttribute/Value eq {platformSerialIdentifier})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'platformSerialIdentifier' and att/OData.CSC.StringAttribute/Value in ({platformSerialIdentifiers}))"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'processingDate' and att/OData.CSC.StringAttribute/Value eq {processing:datetime#to_iso_utc_datetime})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'processingCenter' and att/OData.CSC.StringAttribute/Value eq {processing:facility})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'instrumentShortName' and att/OData.CSC.StringAttribute/Value eq {instrumentShortName#to_upper})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'polarisationChannels' and att/OData.CSC.StringAttribute/Value eq {sar:polarization})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'productClass' and att/OData.CSC.StringAttribute/Value eq {productClass})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'orbitNumber' and att/OData.CSC.StringAttribute/Value eq {sat:absolute_orbit})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'relativeOrbitNumber' and att/OData.CSC.StringAttribute/Value eq {sat:relative_orbit})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'cycleNumber' and att/OData.CSC.StringAttribute/Value eq {sat:orbit_cycle})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'orbitDirection' and att/OData.CSC.StringAttribute/Value eq {sat:orbit_state#to_upper})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'datatakeID' and att/OData.CSC.StringAttribute/Value eq {eopf:datatake_id})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'productConsolidation' and att/OData.CSC.StringAttribute/Value eq {productConsolidation})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'qualityDataObjectID' and att/OData.CSC.StringAttribute/Value eq {qualityDataObjectID})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'coordinates' and att/OData.CSC.StringAttribute/Value eq {coordinates})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'sliceProductFlag' and att/OData.CSC.StringAttribute/Value eq {sliceProductFlag})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'instrumentConfigurationID' and att/OData.CSC.StringAttribute/Value eq {instrumentConfigurationID})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'startTimeFromAscendingNode' and att/OData.CSC.StringAttribute/Value eq {startTimeFromAscendingNode})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'completionTimeFromAscendingNode' and att/OData.CSC.StringAttribute/Value eq {completionTimeFromAscendingNode})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'beginningDateTime' and att/OData.CSC.StringAttribute/Value eq {start_datetime#to_iso_utc_datetime})"
          - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'endingDateTime' and att/OData.CSC.StringAttribute/Value eq {end_datetime#to_iso_utc_datetime})"
          - '{t_before}'
          - '{t_after}'
          - '{t_meets}'
          - '{t_metby}'
          - '{t_overlaps}'
          - '{t_overlappedby}'
          - '{t_starts}'
          - '{t_startedby}'
          - '{t_during}'
          - '{t_contains}'
          - '{t_finishes}'
          - '{t_finishedby}'
          - '{t_equals}'
          - '{t_disjoint}'
          - '{t_intersects}'
    sort:
      sort_by_tpl: '&$orderby={sort_param} {sort_order}'
      sort_param_mapping:
        id: Name
        prip:id: Id
        file:size: ContentLength
        type: ContentType
        eviction_datetime: EvictionDate
        created: PublicationDate
        start_datetime: ContentDate/Start
        end_datetime: ContentDate/End
      sort_order_mapping:
        ascending: asc
        descending: desc
      max_sort_params: 1
    pagination:
      max_items_per_page: 10000
      next_page_url_tpl: '{url}?{search}&$top={items_per_page}&$skip={skip}&$expand=Attributes'
      total_items_nb_key_path: $.total
  download:
    type: HTTPDownload
    base_uri: http://127.0.0.1:5000/Products
    metadata_mapping:
      uid: $.Id
      downloadLink: http://127.0.0.1:5000/Products({uid})/$value
