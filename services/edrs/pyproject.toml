[project]
name = "rs-server-edrs"
dynamic = ["version"] # see: https://github.com/mtkennerly/poetry-dynamic-versioning



[tool.poetry]
name = "rs-server-edrs"
version = "0.0.0"
description = "Copernicus Sentinel rs-server, EDRS service."
license = "Apache-2.0"
authors = ["ESA under contract with Airbus and CS <ops_coprs@airbus.com>"]
readme = "README.md"
homepage = "https://home.rs-python.eu/"
repository = "https://github.com/RS-PYTHON/rs-server"
documentation = ""
keywords = ["stac", "copernicus", "sentinel", "processing", "edrs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: OpenTelemetry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing"
]

packages = [
    { include = "rs_server_edrs" },
]
