id:
  type: string
  title: id
  format: string
  description: STAC Item id (session identifier)
collection:
  type: string
  title: collection
  format: string
  description: Collection id
datetime:
  type: string
  title: datetime
  format: date-time
  description: Nominal datetime (session nominal time)
start_datetime:
  type: string
  title: start_datetime
  format: date-time
  description: Session start time
end_datetime:
  type: string
  title: end_datetime
  format: date-time
  description: Session end time
satellite:
  type: string
  title: satellite
  format: string
  description: Satellite code (e.g., S1A, S1C, S2B)
platform:
  type: string
  title: platform
  format: string
  description: Platform (derived)
constellation:
  type: string
  title: constellation
  format: string
  description: Constellation (e.g., sentinel-1)
"edrs:center":
  type: string
  title: edrs:center
  format: string
  description: EDRS center (pedc|bedc)
"edrs:channel":
  type: integer
  title: edrs:channel
  format: integer
  description: Channel number (1|2)
"edrs:dcsu":
  type: string
  title: edrs:dcsu
  format: string
  description: DCSU identifier
"edrs:session_id":
  type: string
  title: edrs:session_id
  format: string
  description: EDRS session name
