# This root project is not built nor released: it only defines the uv workspace that contains all the
# services (see [tool.uv.workspace]), with a single uv.lock file, and the dev dependencies used by the CI/CD
# and the developers to run pytest, pylint, mypy etc... on the whole github project.
# All the dependencies for release are set in the services/*/pyproject.toml files.
[project]
name = "rs-server"
version = "0.0.0"
description = "Copernicus Sentinel rs-server."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<4"
dependencies = [
    "rs-server-adgs",
    "rs-server-cadip",
    "rs-server-catalog",
    "rs-server-common",
    "rs-server-frontend",
    "rs-server-osam",
    "rs-server-prip",
    "rs-server-staging",
]

# Dev dependencies of all the services, installed by default by 'uv sync'
[dependency-groups]
dev = [
    "bandit>=1.9.4,<2",
    "black>=26.3.1",
    "click>=8.3.3",
    "flake8>=7.3.0,<8",
    "flake8-pyproject>=1.2.4,<2",
    "flask>=3.1.1,<4", # for moto
    "flask-cors>=6.0.1,<7", # for moto
    "httpx>=0.28.1,<0.29",
    "moto>=5.1.10,<6",
    "mypy>=2.1.0,<3",
    "pre-commit>=4.6.0,<5",
    "psycopg2>=2.9.11,<3",
    "pygeoapi>=0.24",
    "pylint>=4.0.5,<5",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-docker>=3.2.5,<4",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-error-for-skips>=2.0.2,<3",
    "pytest-httpx>=0.36",
    "pytest-mock>=3.15.1,<4",
    "pytest-responses>=0.5.1,<0.7.0",
    "responses>=0.26.0,<0.27",
    "sphinx>=9.1.0,<10",
    "sphinx-rtd-theme>=3.0.1,<4",
    "sqlalchemy-utils>=0.43.0,<0.44",
    "types-requests>=2.33.0.20260513,<3",
]

[tool.uv]
package = false # don't build the root project
# Packages without binary wheels, built from their source distribution. All the other packages must be installed
# from wheels (e.g. with 'uv sync --no-build') so that no setup script is executed.
no-binary-package = [
    "psycopg2",
]

[tool.uv.workspace]
members = ["services/*"]

[tool.uv.sources]
rs-server-adgs = { workspace = true }
rs-server-cadip = { workspace = true }
rs-server-catalog = { workspace = true }
rs-server-common = { workspace = true }
rs-server-frontend = { workspace = true }
rs-server-osam = { workspace = true }
rs-server-prip = { workspace = true }
rs-server-staging = { workspace = true }

[tool.black]
line-length = 120

[tool.pytest.ini_options]
markers = [
    "unit", # mark a test as unittest
    "integration", # mark a test as integration test
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
# https://github.com/CS-SI/eodag/issues/1623
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:eodag.plugins.manager",
    "ignore::DeprecationWarning:pydantic._internal._config",
    "ignore::DeprecationWarning:pydantic.fields"
]

[tool.mypy]
warn_redundant_casts = true
# Force analyze of partially annotate function signatures
check_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203" # whitespace before ':'
]
# per-file-ignores = [
#     '__init__.py:F401',
# ]

[tool.pylint]
max-line-length = 120
load-plugins = [
    "pylint.extensions.docparams",
]
# Check docstring args against function signatures (Google style)
default-docstring-type = "google"
accept-no-param-doc = true    # only check functions that already have an Args section
accept-no-raise-doc = true
accept-no-return-doc = true
accept-no-yields-doc = true
disable = [
    "import-error",
    "logging-fstring-interpolation",
    "missing-type-doc",      # type annotations in docstrings: already enforced by mypy
    "differing-type-doc",    # idem
    "not-context-manager",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
]
ignore-paths = '^docs/.*$'

# Only add notes as comments that are not checked for errors.
notes = ["XXX"]  # No errors on TODO and FIXME

min-similarity-lines = 10  # Minimum lines number of a similarity

[tool.bandit]
exclude_dirs = ["tests", "services/common/rs_server_common/utils/pytest"]
